[package]
name = "jns42-core"
version = "0.1.3"
edition = "2024"
description = "Core of jns42"
license = "ISC"
authors = ["Elmer Bulthuis"]
homepage = "https://www.JsonSchema42.org"
keywords = ["json", "schema"]
repository = "https://github.com/LuvDaSun/JsonSchema42"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
im = "^15.1.0"
url = "^2.5.8"
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = "^1.0.149"
once_cell = "^1.21.3"
proc-macro2 = "1.0.106"
quote = "^1.0.44"
regex = "^1.12.3"
urlencoding = "2.1.3"
itertools = "0.14.0"
serde_yaml = "^0.9.34"
semver = "1.0.27"
wit-bindgen = "0.53.1"

[lib]
crate-type = ["rlib", "cdylib"]
